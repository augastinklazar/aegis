[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-sdk"
version = "0.1.0"
authors = [
  { name="Aegis Contributors", email="security@aegis-auth.org" },
]
description = "Python SDK for Aegis: Agentic Zero-Trust Gateway & Transactional Sandbox"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.1.0"]
